services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nkp
      POSTGRES_PASSWORD: nkp_dev_password
      POSTGRES_DB: nkp
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nkp"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  ai-service:
    build: ./apps/ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-token}
    ports: ["127.0.0.1:8000:8000"]
volumes:
  pgdata:
